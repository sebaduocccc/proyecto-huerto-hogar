</head>
<body>

      <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Site Name</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
 
 
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
            <a class="nav-link disabled" href="#">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="productos.html">Productos</a>

        <li class="nav-item">

    <div class="container">
            <div class="row justify-content-center">
                <div class="card menu-sesion d-flex justify-content-center align-items-center min-vh-50 text-center">
                    <div class="card-body">

                        <div class="mb-5"><h2 class="card-title">Registro</h2></div>
                        
                        <form action="" id="form-registro">

                            <div class="mb-3">
                                <label for="" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" placeholder="Nombre" id="name" name="nombre">
                            </div>
                            
                            <div class="mb-3">
                                <label for="" class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="john_doe@correo.cl" id="mail" name="correo">
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" placeholder="•••••••••••••••" id="password1" name="password1">
                                <div class="form-text">Asegurate de crear una contraseña segura.</div>
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" placeholder="•••••••••••••••" id="password2" name="password2">
                                <div class="form-text"></div>
                            </div>

                            <div class="mb-2">
                                <div class="alert alert-danger">Las contraseñas deben coincidir</div>
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Telefono</label>
                                <input type="text" class="form-control" placeholder="+56 9 1234 5678" id="phone" name="telefono">
                            </div>

                            

                            <div class="row mb-3">
                                <label for="" class="form-label">Direccion</label>
                                <div class="col-6"><select name="" id="region" class="form-select" name="region"></select></div>
                                <div class="col-6"><select name="" id="comuna" class="form-select" name="comuna"></select></div>
                                
                            </div>
                            <input type="text" placeholder="Calle" class="form-control mb-3" id="address" name="direccion">

                            

                            

                            <button type="submit" class="btn btn-primary">Registrarme</button>
                        </form>

                    
                        <div class="mb-3">
                            <a href="login.html" class="card-link">¿Ya tienes cuenta? Inicia sesión acá</a>
                        </div>
                    </div>
                </div>
            </div>
    </div>





    <div class="modal fade" tabindex="-1" id="modal1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal"></h5>
                    <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" id="mensaje-modal">
                </div>

            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>

    <script src="js/direccion.js"></script>
