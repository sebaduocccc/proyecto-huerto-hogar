    <div class="container">
            <div class="row justify-content-center">
                <div class="card menu-sesion d-flex justify-content-center align-items-center min-vh-50">
                    <div class="card-body">

                        <div class="mb-5"><h2 class="card-title">Registro</h2></div>
                        
                        <form action="">

                            <div class="mb-3">
                                <label for="" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" placeholder="Nombre">
                            </div>
                            
                            <div class="mb-3">
                                <label for="" class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="john_doe@correo.cl">
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Contraseña</label>
                                <input type="password" class="form-control">
                                <div class="form-text">Asegurate de crear una contraseña segura.</div>
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control">
                                <div class="form-text"></div>
                            </div>

                            <div class="mb-2">
                                <div class="alert alert-danger">Las contraseñas deben coincidir</div>
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Telefono</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="check1">
                                <label for="check1" class="form-check-label">Recordar</label>
                            </div>

                            <select name="" id="comunas" class="form-select">
                                <option selected>Selecciona tu comuna</option>
                            </select>

                        </form>

                    
                        <a href="#" class="btn btn-primary">Iniciar Sesión</a>
                    </div>
                </div>
            </div>
    </div>
