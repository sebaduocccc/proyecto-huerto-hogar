# Huerto Hogar - base de datos + backend
#
#   Todo:              podman compose up -d --build     (o docker compose ...)
#   Solo la BD (dev):  podman compose up -d db          y el backend con ./mvnw spring-boot:run
#
# Variables opcionales en un archivo .env (ver .env.example)

services:
  db:
    image: docker.io/library/mysql:8.4
    container_name: huerto-hogar-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-huerto_hogar}
      MYSQL_USER: ${DB_USER:-huerto}
      MYSQL_PASSWORD: ${DB_PASSWORD:-huerto}
      TZ: America/Santiago
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - huerto_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: huerto-hogar-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-huerto_hogar}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago
      DB_USER: ${DB_USER:-huerto}
      DB_PASSWORD: ${DB_PASSWORD:-huerto}
      # secreto de DESARROLLO por defecto; en produccion definir JWT_SECRET en .env
      JWT_SECRET: ${JWT_SECRET:-zUhpqqZMANHW/r+pjL429frlIFlbinN/zOtMAmP1IywzCCBY0hcVKBU+223F4CzV}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TZ: America/Santiago
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  huerto_db_data:
