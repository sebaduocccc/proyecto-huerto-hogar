<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huerto Hogar | Admin Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/login.css">
    <link href="css/styles.css" rel="stylesheet">

</head>
<body>

     <div class="wrapper">
        <aside id="sidebar">
            <div class="d-flex">
                <button id="toggle-btn" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="sidebar-logo">
                    <a href="#">HuertoHogar</a>
                </div>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item sidebar-focus">
                    <a href="admin.html" class="sidebar-link">
                        <i class="fa-regular fa-house"></i>
                        <span>Inicio</span>
                    </a>
                </li>
                <li class="sidebar-item sidebar-focused-item">
                    <a href="admin-usuarios.html" class="sidebar-link">
                        <i class="fa-solid fa-users-rectangle"></i>
                        <span>Usuarios</span>
                    </a>
                </li>
                
                <li class="sidebar-item sidebar-focus">
                    <a href="admin-productos.html" class="sidebar-link">
                        <i class="fa-solid fa-carrot"></i>
                        <span>Productos</span>
                    </a>
                </li>
            </ul>
        </aside>
        <div class="main-admin container p-3 my-5">
            
            <div class="d-flex justify-content-between align-items-center mb-4 text-center">

                <h1 class="fw-bold">Gestión de Usuarios</h1>


            </div>

            <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3" id="form-title">Crear Usuario</h5>
                        <form id="product-form">

                            <div class="mb-3">
                                <label for="sku-input" class="form-label small fw-bold">Nombre Completo</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Nombre">
                            </div>

                            <div class="mb-3">
                                <label for="name-input" class="form-label small fw-bold">Correo</label>
                                <input type="text" id="correo" class="form-control" placeholder="john_doe@correo.com">                                
                            </div>

                            <div class="d-grid mb-3">
                                <label for="category-input" class="form-label small fw-bold">Rol</label>                                
                                <select name="category-input" id="rol">
                                    <option value="" disabled selected>Selecciona una categoría</option>
                                    <option value="Orgánicos">Usuario Común</option>
                                    <option value="Lácteos">Administrador</option>
                                </select>
                            </div>


                            <div class="mb-3">
                                <label for="price-input" class="form-label small fw-bold">Contraseña</label>
                                <input type="password" id="password" class="form-control" min="1" placeholder="•••••••••••••••">                                
                            </div>

                            <div class="mb-3">
                                <label for="image-input" class="form-label small fw-bold">Confirmar Contraseña</label>
                                <input type="password" id="password2" class="form-control" placeholder="•••••••••••••••">           
                            </div>

                            <div class="mb-3">
                                <label for="image-input" class="form-label small fw-bold">RUT</label>
                                <input type="text" id="rut" class="form-control" placeholder="12.345.678-9">           
                            </div>

                            <div class="mb-3">
                                <label for="image-input" class="form-label small fw-bold">Telefono</label>
                                <input type="text" id="telefono" class="form-control" placeholder="+56 9 1234 5678">           
                            </div>
                            
                            <div class="mb-3">
                                <label for="image-input" class="form-label small fw-bold">Fecha de Nacimiento</label>
                                <input type="date" id="fechaNacimiento" class="form-control">           
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label small fw-bold">Direccion</label>
                                <div class=""><select name="" id="region" class="form-select" name="region"></select></div>
                            </div>

                            <div class="mb-3">
                                <div class=""><select name="" id="comuna" class="form-select" name="comuna"></select></div>
                            </div>

                            <div class="mb-3">
                                <input type="text" id="direccion" class="form-control" placeholder="Pacotilla #288">     
                            </div>
                            

                            <div class="d-grid gap-2">
                                <button type="submit" id="save-btn" class="btn btn-primary">Guardar Producto</button>
                                <button type="button" id="cancel-btn" class="btn btn-outline-danger">Cancelar</button>
                            </div>
                        </form>

                        
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-3">Base de Datos de Usuarios</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Id</th>
                                    <th>Nombre Completo</th>
                                    <th>Correo</th>
                                    <th>Rut</th>
                                    <th>Telefono</th>
                                    <th>Direccion</th>
                                    <th>Fecha de Nacimiento</th>
                                    <th>Rol</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body"></tbody>
                        </table>
                    </div>  
                </div>
            </div>
        </div>

        </div>
    </div>

    <!-- Modal para informacion-->
    <div class="modal fade" tabindex="-1" id="modal1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal"></h5>
                    <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" id="mensaje-modal">
                </div>

            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
    <script src="js/interfaz.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/direccion.js"></script>
    <script src="js/admin_sidebar.js"></script>
    <script src="js/admin-usuarios"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.min.js" integrity="sha512-2+f4MxT8KwN4tUzw6/hv9kxKiix603S9kmBcix+0y0dBhd6zdaPOV1Thf1DM886pFZG+cAtmshBi8UBpo6m3JA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
