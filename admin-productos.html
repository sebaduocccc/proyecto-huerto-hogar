<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración Productos - Huerto Hogar</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Font Awesome Icons -->


    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">Panel de Administración de Productos</h1>
            <a href="index.html" class="btn btn-outline-secondary">Volver a la Tienda</a>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3" id="form-title">Agregar Productos</h5>
                        <form id="product-form">
                            <!-- para saber si alguien está editando el catalogo -->
                            <input type="hidden" id="is-editing" value="false">

                            <div class="mb-3">
                                <label for="sku-input" class="form-label small fw-bold">SKU</label>
                                <input type="text" id="sku-input" class="form-control" placeholder="Ej: FR001" required>
                                <div class="form-text">Identificador único del producto</div>
                            </div>

                            <div class="mb-3">
                                <label for="name-input" class="form-label small fw-bold">Nombre</label>
                                <input type="text" id="name-input" class="form-control" placeholder="Ej: Manzanas" required>                                
                            </div>

                            <div class="mb-3">
                                <label for="category-input" class="form-label small fw-bold">Categoría</label>
                                <input type="text" id="category-input" class="form-control" placeholder="Ej: Frutas" required>                                
                            </div>

                            <div class="mb-3">
                                <label for="price-input" class="form-label small fw-bold">Precio</label>
                                <input type="text" id="price-input" class="form-control" min="1" placeholder="Ej: 1000" required>                                
                            </div>

                            <div class="mb-3">
                                <label for="image-input" class="form-label small fw-bold">Imagen</label>
                                <input type="text" id="image-input" class="form-control" placeholder="Ej: Frutas" required>                                
                            </div>

                            <div class="mb-3">
                                <label for="desc-input" class="form-label small fw-bold">Descripción</label>
                                <textarea id="desc-input" class="form-control" rows="2" required></textarea>                              
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" id="save-btn" class="btn btn-primary">Guardar Producto</button>
                                <button type="button" id="cancel-btn" class="btn btn-outline-danger">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-3">Inventario Actual</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>SKU</th>
                                    <th>Producto</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body"></tbody>
                        </table>
                    </div>  
                </div>
            </div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/064a97935a.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
