server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # la API se reenvia al contenedor del backend (mismo origen, asi funciona la cookie de sesion)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # documentacion de la API
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        # sin $uri/ porque public/productos (imagenes) se llama igual que la ruta /productos
        try_files $uri /index.html;
    }
}
