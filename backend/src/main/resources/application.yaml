spring:
  application:
    name: huerto-hogar-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/huerto_hogar?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Santiago}
    username: ${DB_USER:huerto}
    password: ${DB_PASSWORD:huerto}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # el esquema lo maneja Flyway; Hibernate solo valida que las entidades calcen con las tablas
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Santiago

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # base64, minimo 256 bits. EN PRODUCCION definir JWT_SECRET (openssl rand -base64 48)
    secret: ${JWT_SECRET:zUhpqqZMANHW/r+pjL429frlIFlbinN/zOtMAmP1IywzCCBY0hcVKBU+223F4CzV}
    issuer: huerto-hogar
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    # si dos pestañas renuevan al mismo tiempo, la segunda no se trata como robo de token
    refresh-reuse-grace: 20s
    cookie-name: hh_refresh
    # true en produccion (HTTPS)
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
