<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <h1>hola</h1>

    <div class="container">
            <div class="row justify-content-center">
                <div class="card menu-sesion d-flex justify-content-center align-items-center min-vh-100 ">
                    <div class="card-body">
                        <h2 class="card-title">Iniciar Sesión</h2>
                    
                        <form action="">

                            <div class="mb-3">
                                <label for="" class="form-label">Email</label>
                                <input type="email" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="" class="form-label">Contraseña</label>
                                <input type="password" class="form-control">
                                <div class="form-text">No compartas tu contraseña con nadie.</div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="check1">
                                <label for="check1" class="form-check-label">Recordar</label>
                            </div>

                        </form>

                    
                        <a href="#" class="btn btn-primary">Iniciar Sesión</a>
                    </div>
                </div>
            </div>
    </div>



            

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
