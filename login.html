<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <h1>hola</h1>

    <div class="container">
            <div class="row justify-content-center text-center">
                <div class="card menu-sesion d-flex justify-content-center align-items-center min-vh-50">
                    <div class="card-body">

                        <div class="mb-5"><h2 class="card-title">Iniciar Sesión</h2></div>
                        
                        <form action="" id="form-login">

                            <div class="mb-5">
                                <label for="" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>

                            <div class="mb-1">
                                <label for="" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password">
                                <div class="form-text">No compartas tu contraseña con nadie.</div>
                            </div>

                            <div class="mb-2">
                                <a href="register.html" class="card-link">¿No tienes cuenta? Registrate</a>
                                <a href="pagina_protected.html" class="card-link">probar pagina</a>
                            </div>

                            <div class="mb-5 form-check d-flex justify-content-center gap-2">
                                <input type="checkbox" class="form-check-input" id="check1">
                                <label for="check1" class="form-check-label">Recordar</label>
                            </div>

                            <button type="submit" class="btn btn-primary mb-3">Iniciar Sesión</button>
                        </form>

                    
                        
                    </div>
                </div>
            </div>
    </div>

    <div class="modal fade" tabindex="-1" id="modal1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal"></h5>
                    <button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" id="mensaje-modal">
                </div>

            </div>
        </div>
    </div>

    <script src="js/funciones.js"></script>
    <script src="js/interfaz.js"></script>
    <script src="js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
